[project]
name = "toy-jepa"
version = "0.1.0"
description = "A JAX and JEPA learning experience"
readme = "README.md"
authors = [
    { name = "Andy Wang", email = "andywang0321@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jax[cuda13]; sys_platform == 'linux'",
    "jax; sys_platform != 'linux'",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "tiny-worlds[friction-mnist]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=8.0",
]


[tool.ruff]
target-version = "py313"
line-length = 120

[tool.uv.sources]
tiny-worlds = { path = "../tiny-worlds", editable = true }
